<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Productos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <!-- Search and Filters -->
  <div class="filters-section">
    <ion-searchbar 
      placeholder="Buscar productos..."
      (ionInput)="onSearchChange($event)"
      debounce="300">
    </ion-searchbar>
    
    <ion-item>
      <ion-label>Categoría</ion-label>
      <ion-select 
        placeholder="Seleccionar categoría"
        (ionChange)="onCategoryChange($event)"
        [value]="selectedCategory">
        <ion-select-option *ngFor="let category of categories" [value]="category">
          {{ category }}
        </ion-select-option>
      </ion-select>
    </ion-item>
  </div>

  <!-- Loading -->
  <app-loading-skeleton 
    *ngIf="loading" 
    type="product" 
    [count]="6">
  </app-loading-skeleton>

  <!-- Products Grid -->
  <div *ngIf="!loading" class="products-container">
    
    <!-- Results Info -->
    <div class="results-info">
      <p>{{ filteredProducts.length }} producto(s) encontrado(s)</p>
    </div>

    <!-- No Results -->
    <div *ngIf="filteredProducts.length === 0" class="no-results">
      <ion-icon name="search" size="large"></ion-icon>
      <h3>No se encontraron productos</h3>
      <p>Intenta con otros términos de búsqueda</p>
    </div>

    <!-- Products List -->
    <div *ngIf="filteredProducts.length > 0" class="responsive-grid">
      <app-product-card 
        *ngFor="let product of filteredProducts" 
        [product]="product"
        (addToCart)="addToCart($event)"
        (viewProduct)="viewProduct($event)">
      </app-product-card>
    </div>
  </div>

</ion-content>
