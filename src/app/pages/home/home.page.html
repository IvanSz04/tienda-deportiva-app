<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Tienda Deportiva</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <!-- Hero Section -->
  <div class="hero-section">
    <div class="hero-content">
      <h1>Encuentra tu equipamiento deportivo</h1>
      <p>Las mejores marcas al mejor precio</p>
      <ion-button expand="block" (click)="goToProducts()">
        Ver Productos
      </ion-button>
    </div>
  </div>

  <!-- Categories Section -->
  <div class="section">
    <h2>Categorías</h2>
    <div class="categories-grid">
      <ion-card *ngFor="let category of categories" (click)="goToCategory(category)" class="category-card">
        <ion-card-content>
          <ion-icon name="shirt" size="large"></ion-icon>
          <h3>{{ category }}</h3>
        </ion-card-content>
      </ion-card>
    </div>
  </div>

  <!-- Featured Products Section -->
  <div class="section">
    <h2>Productos Destacados</h2>
    
    <app-loading-skeleton 
      *ngIf="loading" 
      type="product" 
      [count]="4">
    </app-loading-skeleton>

    <div *ngIf="!loading" class="responsive-grid">
      <app-product-card 
        *ngFor="let product of featuredProducts" 
        [product]="product"
        (addToCart)="addToCart($event)"
        (viewProduct)="viewProduct($event)">
      </app-product-card>
    </div>
  </div>

</ion-content>
