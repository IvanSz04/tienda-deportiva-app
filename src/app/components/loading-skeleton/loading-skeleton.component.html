<div class="skeleton-container">
  
  <!-- Product Skeleton -->
  <div *ngIf="type === 'product'" class="skeleton-grid">
    <div *ngFor="let item of getSkeletonArray()" class="skeleton-product">
      <div class="skeleton-image"></div>
      <div class="skeleton-content">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line short"></div>
        <div class="skeleton-line long"></div>
      </div>
    </div>
  </div>
  
  <!-- List Skeleton -->
  <div *ngIf="type === 'list'" class="skeleton-list">
    <div *ngFor="let item of getSkeletonArray()" class="skeleton-list-item">
      <div class="skeleton-avatar"></div>
      <div class="skeleton-text">
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line short"></div>
      </div>
    </div>
  </div>
  
  <!-- Text Skeleton -->
  <div *ngIf="type === 'text'" class="skeleton-text-block">
    <div *ngFor="let item of getSkeletonArray()" class="skeleton-line" [style.height]="height" [style.width]="width"></div>
  </div>
  
</div>
